name: Deploy to Netlify

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run types:check

      - name: Check code copy policy
        run: node --experimental-strip-types scripts/check-code-copy.mjs

      - name: Build and deploy documentation site
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        # The CLI builds with the Next.js adapter, including the MCP and search functions.
        run: npx --yes netlify-cli@27.10.2 deploy --prod
