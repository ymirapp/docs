<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">Restoring a database server backup creates a new server that Ymir doesn't use</title>
  <desc id="desc">Your Ymir project, example-project, is connected to example-database-server, a database server that Ymir manages in your AWS account. The server holds a database, example_database. When backups of the server are available in AWS, they can include automated backups for point-in-time restores and manual snapshots that you take. An AWS restore from an available backup creates a separate new DB instance or DB cluster, restored-database-server, next to the original. It never overwrites or replaces example-database-server. Ymir doesn't adopt the restored server and your project isn't connected to it; your project stays connected to the original server. To recover data, a dashed arrow shows a reviewed data copy: export the data you need from the restored server with your own tools, review it, then import it into a database on a Ymir database server with database:import. Check in AWS that backups exist and how they're set up before you rely on them. Backups only contain database server data, not your project code, uploads, environment variables or secrets.</desc>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#071812"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f7a54"/>
    </marker>
  </defs>

  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #071812; }
    .area { fill: #e9e7dc; stroke: #40594d; stroke-width: 1.5; }
    .panel { fill: #f4f1e6; stroke: #40594d; stroke-opacity: 0.45; stroke-width: 1.25; }
    .item { fill: #f4f1e6; stroke: #40594d; stroke-opacity: 0.35; stroke-width: 1; }
    .managed { fill: #dde7da; stroke: #2f7a54; stroke-width: 1.5; }
    .unmanaged { fill: #f4f1e6; stroke: #071812; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .heading { font-size: 20px; font-weight: 700; }
    .title { font-size: 16px; font-weight: 700; }
    .title-green { font-size: 16px; font-weight: 700; fill: #2f7a54; }
    .label { font-size: 16px; }
    .small { font-size: 15px; fill: #40594d; }
    .code-small { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #40594d; }
    .note-green { font-size: 15px; font-style: italic; fill: #2f7a54; }
    .note-ink { font-size: 16px; font-style: italic; }
    .note { font-size: 15px; font-style: italic; fill: #40594d; }
  </style>

  <rect width="1100" height="640" fill="#f4f1e6"/>

  <!-- Ymir project -->
  <rect class="panel" x="20" y="76" width="180" height="100" rx="12"/>
  <text class="title" x="110" y="112" text-anchor="middle">Ymir project</text>
  <text class="small" x="110" y="136" text-anchor="middle">example-project</text>
  <text class="small" x="110" y="158" text-anchor="middle">keeps using the original</text>

  <!-- Your AWS account -->
  <rect class="area" x="280" y="20" width="800" height="500" rx="12"/>
  <text class="heading" x="296" y="52">Your AWS account</text>

  <!-- Connection -->
  <line x1="200" y1="126" x2="302" y2="126" stroke="#2f7a54" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text class="note-green" x="240" y="114" text-anchor="middle">connected</text>

  <!-- Original database server -->
  <rect class="managed" x="304" y="76" width="280" height="180" rx="8"/>
  <text class="title" x="320" y="104">example-database-server</text>
  <text class="title-green" x="320" y="128">Managed by Ymir</text>
  <rect class="item" x="324" y="150" width="240" height="84" rx="8"/>
  <text class="title" x="340" y="180">Database</text>
  <text class="code-small" x="340" y="204">example_database</text>
  <text class="small" x="340" y="224">inside the server</text>

  <!-- Backups -->
  <line x1="444" y1="256" x2="444" y2="326" stroke="#071812" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <text class="small" x="456" y="286">AWS backups,</text>
  <text class="small" x="456" y="306">when they exist</text>
  <rect class="panel" x="304" y="330" width="280" height="166" rx="12"/>
  <text class="title" x="320" y="358">Available AWS backups</text>
  <rect class="item" x="320" y="372" width="248" height="52" rx="8"/>
  <text class="title" x="336" y="395">Automated backups</text>
  <text class="small" x="336" y="414">for point-in-time restores</text>
  <rect class="item" x="320" y="432" width="248" height="52" rx="8"/>
  <text class="title" x="336" y="455">Manual snapshot</text>
  <text class="small" x="336" y="474">taken by you</text>

  <!-- AWS restore -->
  <path d="M584 428 H930 V262" fill="none" stroke="#071812" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <text class="title" x="750" y="414" text-anchor="middle">AWS restore</text>
  <text class="small" x="750" y="452" text-anchor="middle">creates a new server next to the</text>
  <text class="small" x="750" y="472" text-anchor="middle">original. It never overwrites it.</text>

  <!-- Restored database server -->
  <rect class="unmanaged" x="800" y="76" width="260" height="180" rx="8"/>
  <text class="title" x="816" y="104">New DB instance</text>
  <text class="title" x="816" y="126">or DB cluster</text>
  <text class="code-small" x="816" y="150">restored-database-server</text>
  <text class="label" x="816" y="200">Not adopted by Ymir</text>
  <text class="label" x="816" y="224">Not connected to your</text>
  <text class="label" x="816" y="244">project</text>

  <!-- Reviewed data copy -->
  <line x1="800" y1="192" x2="568" y2="192" stroke="#071812" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow-ink)"/>
  <text class="title" x="692" y="178" text-anchor="middle">Reviewed data copy</text>
  <text class="small" x="692" y="222" text-anchor="middle">1. Export the data you</text>
  <text class="small" x="692" y="242" text-anchor="middle">need with your tools</text>
  <text class="small" x="692" y="270" text-anchor="middle">2. Review it, then import</text>
  <text class="small" x="692" y="290" text-anchor="middle">into a database with</text>
  <text class="code-small" x="692" y="310" text-anchor="middle">database:import</text>

  <text class="note-ink" x="550" y="556" text-anchor="middle">A restore never replaces example-database-server, and your project doesn't switch to the new server.</text>
  <text class="note" x="550" y="584" text-anchor="middle">Check in AWS that backups exist and how they're set up before you rely on them.</text>
  <text class="note" x="550" y="612" text-anchor="middle">Backups only contain database server data, not your project code, uploads, environment variables or secrets.</text>
</svg>
