<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc">
  <title id="title">Normal processing by the Ymir Laravel bridge</title>
  <desc id="desc">Normal processing by the Ymir Laravel bridge, with two standard SQS queues, default and emails. A Laravel application with the Ymir Laravel bridge dispatches a ProcessPodcast job to the default queue and a SendNewsletter job to the emails queue. Each queue has its own queue function: the default queue invokes the default queue function and the emails queue invokes the emails queue function. Each queue function starts a new PHP process for each job, which boots Laravel and runs the job. In either lane, if the job succeeds, the bridge deletes the job's SQS message. If the job throws an exception that Laravel handles, two paths are possible. If Laravel releases the job, the bridge deletes the original message, then sends a copy of the job back to the same queue it came from, with a delivery delay set to the backoff. If the job is out of attempts, Laravel records it in your application's failed job storage, such as the failed_jobs table, only if that storage is configured and working. Ymir doesn't configure a dead-letter queue. A job can run more than once.</desc>

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#071812"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#40594d"/>
    </marker>
  </defs>

  <style>
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #071812; }
    .area { fill: #e9e7dc; stroke: #40594d; stroke-width: 1.5; }
    .panel { fill: #f4f1e6; stroke: #40594d; stroke-opacity: 0.45; stroke-width: 1.25; }
    .item { fill: #f4f1e6; stroke: #40594d; stroke-opacity: 0.35; stroke-width: 1; }
    .item-dark { fill: #e9e7dc; stroke: #40594d; stroke-opacity: 0.35; stroke-width: 1; }
    .success { fill: #dde7da; stroke: #2f7a54; stroke-width: 1.5; }
    .tag { fill: #071812; }
    .heading { font-size: 20px; font-weight: 700; }
    .title { font-size: 16px; font-weight: 700; }
    .title-green { font-size: 16px; font-weight: 700; fill: #2f7a54; }
    .label { font-size: 16px; }
    .small { font-size: 15px; fill: #40594d; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 16px; }
    .note { font-size: 15px; font-style: italic; fill: #40594d; }
    .note-code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-style: normal; }
    .tag-text { font-size: 15px; font-weight: 700; fill: #f4f1e6; }
  </style>

  <rect width="1100" height="780" fill="#f4f1e6"/>

  <!-- The whole flow -->
  <rect class="area" x="20" y="20" width="1060" height="680" rx="12"/>
  <text class="heading" x="36" y="54">Normal processing by the Ymir Laravel bridge</text>

  <!-- Laravel application -->
  <rect class="panel" x="36" y="76" width="240" height="384" rx="10"/>
  <text class="title" x="52" y="102">Laravel application</text>
  <text class="small" x="52" y="124">with the Ymir Laravel bridge</text>
  <rect class="item-dark" x="52" y="138" width="208" height="48" rx="8"/>
  <text class="code" x="156" y="167" text-anchor="middle">ProcessPodcast</text>
  <rect class="item-dark" x="52" y="334" width="208" height="48" rx="8"/>
  <text class="code" x="156" y="363" text-anchor="middle">SendNewsletter</text>
  <text class="note" x="156" y="264" text-anchor="middle">dispatches each job</text>
  <text class="note" x="156" y="284" text-anchor="middle">to its queue</text>

  <!-- default lane -->
  <rect class="panel" x="296" y="76" width="768" height="188" rx="10"/>
  <line x1="260" y1="162" x2="314" y2="162" stroke="#071812" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <rect class="item-dark" x="316" y="112" width="190" height="100" rx="8"/>
  <text class="title" x="411" y="154" text-anchor="middle">Standard SQS queue</text>
  <text class="code" x="411" y="180" text-anchor="middle">default</text>
  <line x1="506" y1="162" x2="584" y2="162" stroke="#071812" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <text class="note" x="545" y="150" text-anchor="middle">invokes</text>
  <rect class="item-dark" x="586" y="112" width="190" height="100" rx="8"/>
  <text class="title" x="681" y="154" text-anchor="middle">Queue function</text>
  <text class="small" x="681" y="178" text-anchor="middle">only for <tspan class="note-code">default</tspan></text>
  <line x1="776" y1="162" x2="854" y2="162" stroke="#071812" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <text class="note" x="815" y="150" text-anchor="middle">starts</text>
  <rect class="item-dark" x="856" y="112" width="192" height="100" rx="8"/>
  <text class="title" x="952" y="138" text-anchor="middle">New PHP process</text>
  <text class="small" x="952" y="162" text-anchor="middle">for each job:</text>
  <text class="small" x="952" y="182" text-anchor="middle">boots Laravel and</text>
  <text class="small" x="952" y="202" text-anchor="middle">runs the job</text>
  <path d="M952 212 V248 H411 V214" fill="none" stroke="#40594d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text class="note" x="681" y="238" text-anchor="middle">If released: a copy goes back to <tspan class="note-code">default</tspan>, delayed by the backoff</text>

  <!-- emails lane -->
  <rect class="panel" x="296" y="272" width="768" height="188" rx="10"/>
  <line x1="260" y1="358" x2="314" y2="358" stroke="#071812" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <rect class="item-dark" x="316" y="308" width="190" height="100" rx="8"/>
  <text class="title" x="411" y="350" text-anchor="middle">Standard SQS queue</text>
  <text class="code" x="411" y="376" text-anchor="middle">emails</text>
  <line x1="506" y1="358" x2="584" y2="358" stroke="#071812" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <text class="note" x="545" y="346" text-anchor="middle">invokes</text>
  <rect class="item-dark" x="586" y="308" width="190" height="100" rx="8"/>
  <text class="title" x="681" y="350" text-anchor="middle">Queue function</text>
  <text class="small" x="681" y="374" text-anchor="middle">only for <tspan class="note-code">emails</tspan></text>
  <line x1="776" y1="358" x2="854" y2="358" stroke="#071812" stroke-width="2" marker-end="url(#arrow-ink)"/>
  <text class="note" x="815" y="346" text-anchor="middle">starts</text>
  <rect class="item-dark" x="856" y="308" width="192" height="100" rx="8"/>
  <text class="title" x="952" y="334" text-anchor="middle">New PHP process</text>
  <text class="small" x="952" y="358" text-anchor="middle">for each job:</text>
  <text class="small" x="952" y="378" text-anchor="middle">boots Laravel and</text>
  <text class="small" x="952" y="398" text-anchor="middle">runs the job</text>
  <path d="M952 408 V444 H411 V410" fill="none" stroke="#40594d" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text class="note" x="681" y="434" text-anchor="middle">If released: a copy goes back to <tspan class="note-code">emails</tspan>, delayed by the backoff</text>

  <!-- Outcomes for each job, in either lane -->
  <text class="title" x="36" y="500">What happens to each job's SQS message, in either lane</text>

  <rect class="success" x="36" y="516" width="320" height="168" rx="10"/>
  <text class="title-green" x="52" y="544">If the job succeeds</text>
  <text class="label" x="52" y="572">The bridge deletes the job's</text>
  <text class="label" x="52" y="594">SQS message.</text>

  <rect class="panel" x="372" y="516" width="692" height="168" rx="10"/>
  <text class="title" x="388" y="544">If the job throws an exception that Laravel handles</text>
  <rect class="item-dark" x="388" y="558" width="322" height="112" rx="8"/>
  <text class="title" x="404" y="584">If Laravel releases the job</text>
  <text class="label" x="404" y="610">The bridge deletes the original</text>
  <text class="label" x="404" y="632">message, then sends a copy to the</text>
  <text class="label" x="404" y="654">same queue, delayed by the backoff.</text>
  <rect class="item-dark" x="726" y="558" width="322" height="112" rx="8"/>
  <text class="title" x="742" y="584">If the job is out of attempts</text>
  <text class="label" x="742" y="610">Laravel records it in your failed job</text>
  <text class="label" x="742" y="632">storage, such as <tspan class="note-code">failed_jobs</tspan>, only</text>
  <text class="label" x="742" y="654">if it's configured and working.</text>

  <!-- Labels -->
  <rect class="tag" x="170" y="726" width="380" height="32" rx="16"/>
  <text class="tag-text" x="360" y="747" text-anchor="middle">Ymir doesn't configure a dead-letter queue</text>
  <rect class="tag" x="590" y="726" width="340" height="32" rx="16"/>
  <text class="tag-text" x="760" y="747" text-anchor="middle">A job can run more than once</text>
</svg>
