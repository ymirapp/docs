<!doctype html>
<!--
    Adapted from the app's resources/og/social-card.html and loads its fonts, so the app must be checked
    out next to the docs. Render from the repository root, with a Playwright install from outside the
    project, after the fonts load (it fails if one does not):
    PLAYWRIGHT_MODULE=/path/to/playwright/index.mjs [CHROME_PATH=/path/to/chrome] node --input-type=module -e "
        const { chromium } = await import(process.env.PLAYWRIGHT_MODULE);
        const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH });
        const page = await browser.newPage({ viewport: { width: 1200, height: 630 } });
        await page.goto('file://$PWD/resources/og/social-card.html');
        const fonts = await page.evaluate(() => document.fonts.ready.then((fonts) => [...fonts].map((font) => font.family + ' ' + font.status)));
        if (fonts.length !== 2 || fonts.some((font) => !font.endsWith(' loaded'))) throw new Error(fonts.join(', '));
        await page.screenshot({ path: 'app/opengraph-image.png' });
        await browser.close();
    "
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=1200, initial-scale=1" />
        <title>Ymir Docs social card</title>
        <style>
            @font-face {
                font-family: Geist;
                src: url('../../../app/public/fonts/geist.woff2') format('woff2');
                font-style: normal;
                font-weight: 100 900;
            }

            @font-face {
                font-family: 'Geist Mono';
                src: url('../../../app/public/fonts/geist-mono.woff2') format('woff2');
                font-style: normal;
                font-weight: 100 900;
            }

            :root {
                --ink: #071812;
                --forest: #0b281f;
                --mineral: #174437;
                --signal: #a5c9a8;
                --bone: #e9e7dc;
                --copy-inverse: #b4c3b9;
                --lead-inverse: #d2ddd4;
                --line: rgba(233, 231, 220, 0.17);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                width: 1200px;
                height: 630px;
                margin: 0;
                overflow: hidden;
            }

            body {
                color: var(--bone);
                background: var(--ink);
                font-family: Geist, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            .card {
                position: relative;
                display: grid;
                grid-template-columns: 78px 1fr;
                width: 100%;
                height: 100%;
                background: linear-gradient(90deg, transparent 72%, rgba(23, 68, 55, 0.3)), var(--ink);
            }

            .card::after {
                position: absolute;
                right: 0;
                bottom: 0;
                width: 540px;
                height: 270px;
                border-top: 1px solid var(--line);
                border-left: 1px solid var(--line);
                background: var(--forest);
                content: '';
            }

            .rail {
                position: relative;
                z-index: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
                padding: 34px 0;
                border-right: 1px solid var(--line);
                color: #71847a;
                font-family: 'Geist Mono', monospace;
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.16em;
                text-transform: uppercase;
                writing-mode: vertical-rl;
            }

            .rail-mark {
                width: 12px;
                height: 12px;
                background: var(--signal);
            }

            .content {
                position: relative;
                z-index: 1;
                display: grid;
                grid-template-rows: 98px 1fr 78px;
                min-width: 0;
                padding: 0 56px 0 58px;
            }

            .header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-bottom: 1px solid var(--line);
            }

            .logo {
                display: block;
                width: 170px;
                height: auto;
                color: var(--bone);
            }

            .notation {
                color: #8ca095;
                font-family: 'Geist Mono', monospace;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.14em;
                text-transform: uppercase;
            }

            .main {
                display: grid;
                grid-template-columns: minmax(0, 1fr) 420px;
                align-items: center;
                gap: 52px;
                min-height: 0;
            }

            .headline {
                margin: -2px 0 0;
                font-size: 96px;
                font-weight: 600;
                letter-spacing: -0.04em;
                line-height: 0.92;
            }

            .headline span {
                display: block;
            }

            .headline .accent {
                color: var(--signal);
            }

            .positioning {
                align-self: end;
                margin: 0 0 44px;
                max-width: 420px;
                color: var(--lead-inverse);
                font-size: 28px;
                font-weight: 450;
                letter-spacing: -0.02em;
                line-height: 1.3;
            }

            .footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
                border-top: 1px solid var(--line);
                color: #8ca095;
                font-family: 'Geist Mono', monospace;
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.12em;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <article class="card" aria-label="Ymir Docs — Field manual">
            <aside class="rail" aria-hidden="true">
                <span>Field manual</span>
                <span class="rail-mark"></span>
                <span>YM / 2026</span>
            </aside>

            <div class="content">
                <header class="header">
                    <svg class="logo" viewBox="0 0 200 50.201561" aria-label="Ymir" role="img">
                        <g transform="matrix(0.36989066,0,0,0.36989066,-89.384019,-116.93723)">
                            <path
                                fill="currentColor"
                                d="M 442.30962,95.016 V 120 h -9 V 95.016 L 411.27762,66 h 11.01601 L 438.34962,86.016 453.32562,66 h 12.024 z"
                                transform="matrix(2.5,0,0,2.5,-786.54421,151.68)"
                            />
                            <path
                                fill="currentColor"
                                d="m 528.63537,65.784 v 54.288 l -9,-7.056 V 84.864 l -18.144,14.112 -18.072,-14.112 v 28.152 l -9.072,7.056 V 65.784 l 27.144,21.168 z"
                                transform="matrix(2.5,0,0,2.5,-771.54421,151.68)"
                            />
                            <path
                                fill="currentColor"
                                d="m 543.6755,66 h 8.928 v 47.016 l -8.928,6.984 z"
                                transform="matrix(2.5,0,0,2.5,-756.54421,151.68)"
                            />
                            <path
                                fill="currentColor"
                                d="m 609.55775,120 h -10.008 l -11.952,-22.032 h -20.016 V 89.04 h 25.992 q 1.656,-0.072 2.952,-0.864 1.152,-0.648 2.088,-2.088 0.936,-1.44 0.936,-4.104 0,-2.592 -0.936,-4.032 -0.936,-1.44 -2.088,-2.088 -1.296,-0.792 -2.952,-0.864 h -25.992 v -9 h 25.992 q 4.176,0.216 7.488,2.016 1.368,0.792 2.736,1.944 1.368,1.152 2.376,2.808 1.08,1.656 1.728,3.96 0.648,2.232 0.648,5.256 0,4.896 -1.584,8.064 -1.584,3.096 -3.6,4.896 -1.944,1.728 -3.744,2.376 -1.728,0.648 -2.088,0.648 z"
                                transform="matrix(2.5,0,0,2.5,-741.54421,151.68)"
                            />
                        </g>
                    </svg>
                    <span class="notation">Documentation / Guides &amp; reference</span>
                </header>

                <main class="main">
                    <h1 class="headline">
                        <span>Field</span>
                        <span class="accent">manual</span>
                    </h1>
                    <p class="positioning">
                        Guides, CLI and configuration<br />reference for serverless<br />WordPress &amp; PHP on Ymir.
                    </p>
                </main>

                <footer class="footer">
                    <span>docs.ymirapp.com</span>
                </footer>
            </div>
        </article>
    </body>
</html>
